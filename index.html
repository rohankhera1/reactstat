<!DOCTYPE html>
<html>
<head>
  <title>ReactStat</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 80px 20px;
      background: #ffffff;
      color: #111;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }
    p {
      font-size: 18px;
      color: #555;
      max-width: 520px;
      margin: 0 auto 40px;
    }
    a.button {
      display: inline-block;
      padding: 16px 32px;
      font-size: 18px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
    .section {
      margin-top: 80px;
    }
  </style>
</head>
<body>

  <h1>ReactStat</h1>
  <p>See who reacts the most in your group chats.</p>

  <a class="button" href="ReactStat.zip">Download for macOS</a>

  <div class="section">
    <h2>Privacy</h2>
    <p>ReactStat runs entirely on your Mac. Your messages never leave your device.</p>
  </div>

  <div class="section">
    <h2>Permissions</h2>
    <p>
      Requires Full Disk Access to read the Messages database.<br>
      Contacts permission is optional (for showing real names).
    </p>
  </div>

</body>
</html>
